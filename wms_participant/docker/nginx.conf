# Serve the Expo static web export. Expo Router paths need HTML fallbacks
# (e.g. /events → events.html or client-side index.html).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # TEMPORARY POC (REV-010): World Masters snapshot at `/`. Remove this location
  # (and world-masters.html) so `/` is the Expo app again.
  location = / {
    rewrite ^ /world-masters.html last;
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
